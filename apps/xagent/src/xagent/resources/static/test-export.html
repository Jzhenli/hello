<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出API测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 3px;
            white-space: pre-wrap;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>通道导出API测试</h1>
    
    <div class="test-section">
        <h2>测试1：导出全部通道（空对象）</h2>
        <button onclick="testExport1()">测试导出</button>
        <div id="result1" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>测试2：导出指定通道</h2>
        <button onclick="testExport2()">测试导出</button>
        <div id="result2" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>测试3：检查后端服务</h2>
        <button onclick="testHealth()">测试连接</button>
        <div id="result3" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const TOKEN = 'xagent_47808';
        
        async function testExport1() {
            const resultDiv = document.getElementById('result1');
            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${API_BASE}/api/channels/export`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">成功！</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">失败！状态码: ${response.status}</span>\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }
        
        async function testExport2() {
            const resultDiv = document.getElementById('result2');
            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${API_BASE}/api/channels/export`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify({
                        channel_ids: ['xnc_001']
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">成功！</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">失败！状态码: ${response.status}</span>\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }
        
        async function testHealth() {
            const resultDiv = document.getElementById('result3');
            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${API_BASE}/api/system/status`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<span class="success">后端服务正常！</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">后端服务异常！状态码: ${response.status}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">无法连接到后端服务: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
